<style>
details.output-fold {
  margin: 0.5rem 0 1rem 0;
}

details.output-fold > summary {
  cursor: pointer;
  font-weight: 500;
  color: #555;
  margin-bottom: 0.5rem;
}

details.output-fold[open] > summary {
  margin-bottom: 0.75rem;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".cell").forEach(function (cell) {

    const children = Array.from(cell.children);
    let group = [];

    function foldGroup() {
      if (group.length === 0) return;

      const text = group
        .map(function (el) {
          return el.innerText || "";
        })
        .join("\n");

      const lineCount = text.split(/\r?\n/).length;

      // Keep short text outputs visible
      if (lineCount <= 8 && text.length <= 800) {
        group = [];
        return;
      }

      const first = group[0];

      const details = document.createElement("details");
      details.className = "output-fold";

      const summary = document.createElement("summary");
      summary.textContent = "Show output";

      first.parentNode.insertBefore(details, first);
      details.appendChild(summary);

      group.forEach(function (output) {
        details.appendChild(output);
      });

      group = [];
    }

    children.forEach(function (child) {

      if (
        child.classList.contains("cell-output-stdout") ||
        child.classList.contains("cell-output-stderr")
      ) {
        group.push(child);
      } else {
        foldGroup();
      }

    });

    foldGroup();

  });

});
</script>
